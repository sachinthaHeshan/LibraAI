services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: libra
      POSTGRES_PASSWORD: libra
      POSTGRES_DB: libra
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libra -d libra"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  pgdata:
